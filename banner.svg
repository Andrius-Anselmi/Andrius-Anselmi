          </svg>
        </xhtml:div>

        <xhtml:div class="terminal">
          <xhtml:div class="terminal-bar">
            <xhtml:div class="dot r"></xhtml:div><xhtml:div class="dot o"></xhtml:div><xhtml:div class="dot g"></xhtml:div>
          </xhtml:div>
          <xhtml:div class="term-body">
            <xhtml:div class="hi">Hi, I'm <xhtml:span class="name">Andrius</xhtml:span> &#128075;</xhtml:div>
            <xhtml:div class="line">&#128187;&#160;<xhtml:span class="green">Junior Software Engineer</xhtml:span></xhtml:div>
