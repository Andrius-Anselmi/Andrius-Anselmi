              <rect x="120" y="20" width="170" height="150" rx="10" fill="#d6d6dc"/>
              <rect x="120" y="20" width="170" height="150" rx="10" fill="#000" opacity="0.04"/>
              <rect x="132" y="34" width="146" height="100" rx="4" fill="#0c1f1c"/>
