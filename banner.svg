<svg width="1100" height="980" viewBox="0 0 1100 980" xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

      .wrap {
        font-family: 'Share Tech Mono', monospace;
        width: 1100px;
        height: 980px;
        background: #0d0d10;
        color: #c8c8d8;
        box-sizing: border-box;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .topbar { font-size: 13px; color: #6a6a80; margin-bottom: 4px; }
      .topbar span { color: #9aa; }

      .hero { display: flex; gap: 16px; }

      .pc-card {
        background: #14141c;
        border: 1px solid #26263a;
        border-radius: 10px;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 460px;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }
      .sparkle { position: absolute; color: #b06aff; font-size: 11px; animation: twinkle 2.2s infinite; }
      @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:1} }
      .pc-svg { width: 380px; }

      .terminal { flex: 1; background: #111118; border: 1px solid #26263a; border-radius: 10px; overflow: hidden; }
      .terminal-bar { background: #1b1b28; padding: 10px 16px; display: flex; gap: 8px; border-bottom: 1px solid #26263a; }
      .dot { width: 13px; height: 13px; border-radius: 50%; }
      .dot.r { background: #ff5f57; } .dot.o { background: #febc2e; } .dot.g { background: #28c840; }
      .term-body { padding: 22px 26px; font-size: 15px; line-height: 2.05; }
      .hi { font-size: 19px; margin-bottom: 8px; }
      .hi .name { color: #00d4ff; font-weight: bold; }
      .line { display: flex; gap: 12px; }
      .green { color: #39ff6e; } .red { color: #ff6b6b; } .yellow { color: #ffd700; }
      .purple { color: #b06aff; } .cyan { color: #00d4ff; } .orange { color: #ff9a52; }
      .prompt { margin-top: 12px; color: #00d4ff; display: flex; align-items: center; gap: 8px; }
      .cursor { display: inline-block; width: 9px; height: 16px; background: #00d4ff; animation: blink 1s step-end infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

      .cards-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .card {
        background: #14141c;
        border: 1px solid #26263a;
        border-radius: 10px;
        padding: 22px 24px;
        position: relative;
        overflow: hidden;
        min-height: 110px;
      }
      .card-file { font-size: 11px; color: #6a6a80; margin-bottom: 14px; display: block; }
      .card-title { font-size: 26px; font-weight: bold; display: flex; align-items: center; gap: 12px; line-height: 1.2; }
      .c-purple .card-title { color: #b06aff; }
      .c-green .card-title { color: #39ff6e; }
      .c-pink .card-title { color: #ff6ec7; }
      .c-cyan .card-title { color: #00d4ff; }
      .c-yellow .card-title { color: #ffd700; }
      .card-emoji { font-size: 30px; }
      .card .sparkle2 { position: absolute; font-size: 11px; color: #555; }

      .bottom { display: flex; gap: 16px; }
      .bottom-card { background: #14141c; border: 1px solid #26263a; border-radius: 10px; padding: 18px 22px; flex: 1; }
      .bottom-title { font-size: 13px; color: #8a8aa0; margin-bottom: 16px; }
      .tech-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .tech-icon { width: 34px; height: 34px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: white; }

      .stats-row { display: flex; gap: 22px; }
      .stat { display: flex; flex-direction: column; gap: 4px; }
      .stat-val { font-size: 18px; color: #39ff6e; font-weight: bold; }
      .stat-label { font-size: 11px; color: #6a6a80; }

      .contrib { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
      .cell { aspect-ratio: 1; border-radius: 2px; background: #1f1f2c; }
      .l1 { background: rgba(57,255,110,0.22); } .l2 { background: rgba(57,255,110,0.48); }
      .l3 { background: rgba(57,255,110,0.72); } .l4 { background: #39ff6e; }
      ]]>
    </style>
  </defs>

  <foreignObject x="0" y="0" width="1100" height="980">
    <xhtml:div class="wrap">

      <xhtml:div class="topbar">Andrius-Anselmi / <xhtml:span>README.md</xhtml:span></xhtml:div>

